name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish; never run two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build
        # GitHub supplies the correct path for project sites, custom domains, and
        # access-controlled Pages URLs.
        run: npm run build -- --base "${{ steps.pages.outputs.base_path }}"

      - name: Verify Pages artifact
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          grep -Fq '<div id="root"></div>' dist/index.html

          if [[ -n "$PAGES_BASE_PATH" ]]; then
            asset_prefix="${PAGES_BASE_PATH%/}/"
          else
            asset_prefix='./'
          fi
          mapfile -t asset_urls < <(
            grep -oE '(src|href)="[^"]+\.(js|css)"' dist/index.html |
              sed -E 's/^(src|href)="//; s/"$//'
          )
          test "${#asset_urls[@]}" -gt 0

          for asset_url in "${asset_urls[@]}"; do
            if [[ "$asset_url" != "$asset_prefix"* ]]; then
              echo "::error::Asset URL '$asset_url' does not use expected asset prefix '$asset_prefix'."
              exit 1
            fi

            asset_path="${asset_url#"$asset_prefix"}"
            if [[ ! -f "dist/$asset_path" ]]; then
              echo "::error::Referenced asset 'dist/$asset_path' is missing."
              exit 1
            fi
          done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
