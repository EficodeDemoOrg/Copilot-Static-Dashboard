<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The dashboard never talks to the network after load and never stores anything.
      connect-src 'none' makes that guarantee enforceable rather than a promise: the
      sample dataset is bundled into the JS (not fetched) and CSV parsing runs on the
      main thread (no blob worker), so nothing here needs a network or blob origin.
      'unsafe-inline' for styles is required by Recharts, which sets inline styles on its SVG.
      font-src 'self' is redundant against default-src but states the intent: the brand
      typefaces are vendored under src/assets/fonts/, never fetched from a font CDN.
      Vite's dev server relaxes this to allow HMR — see the csp() plugin in vite.config.ts.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Copilot Usage Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
